<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:772px; height:250px; overflow:hidden; }
  body {
    font-family:'Plus Jakarta Sans', -apple-system, sans-serif;
    width:772px; height:250px; position:relative;
    background:
      radial-gradient(1100px 520px at 12% -15%, rgba(56,128,255,0.32), transparent 60%),
      radial-gradient(950px 520px at 102% 125%, rgba(99,102,241,0.30), transparent 55%),
      linear-gradient(135deg, #0a1330 0%, #0c1838 45%, #0a1228 100%);
    color:#fff; overflow:hidden;
  }
  .grid { position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:34px 34px;
    mask-image: radial-gradient(820px 360px at 55% 45%, #000 25%, transparent 78%); }
  .glow1 { position:absolute; width:360px; height:360px; border-radius:50%;
    background:radial-gradient(circle, rgba(59,130,246,0.40), transparent 65%);
    filter:blur(34px); left:-110px; top:-130px; }
  .glow2 { position:absolute; width:320px; height:320px; border-radius:50%;
    background:radial-gradient(circle, rgba(99,102,241,0.35), transparent 65%);
    filter:blur(34px); right:-90px; bottom:-120px; }

  .wrap { position:relative; height:100%; display:flex; align-items:center;
          padding:0 46px; gap:30px; z-index:2; }

  /* ---- icon ---- */
  .icon { flex:0 0 auto; filter: drop-shadow(0 16px 30px rgba(37,99,235,0.50)); }

  /* ---- content ---- */
  .content { flex:1 1 auto; min-width:0; }
  .eyebrow { display:inline-flex; align-items:center; gap:9px;
    font-size:11px; font-weight:700; letter-spacing:2.4px; text-transform:uppercase;
    color:#9fc1ff; margin-bottom:13px; }
  .eyebrow .dot { width:6px; height:6px; border-radius:50%; background:#4f9bff; box-shadow:0 0 10px #4f9bff; }
  .eyebrow .brand { color:#dce8ff; }
  .eyebrow .sep { width:4px; height:4px; border-radius:50%; background:#5b6c92; }
  .eyebrow .by { color:#8aa0c8; letter-spacing:1.6px; }

  .headline { font-size:39px; font-weight:800; line-height:1.06; letter-spacing:-1.4px;
    color:#eef4ff; white-space:nowrap; }
  .headline .accent {
    background:linear-gradient(100deg,#5aa3ff,#8ec5ff 55%,#a9b8ff);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:11px; font-size:13.5px; font-weight:500; color:#a9bbdc; }

  /* ---- feature chips (solid pills) ---- */
  .chips { display:flex; flex-wrap:nowrap; gap:9px; margin-top:18px; }
  .chip { display:inline-flex; align-items:center; gap:8px; white-space:nowrap;
    border-radius:11px; padding:8px 13px 8px 9px; font-size:12.5px; font-weight:700; color:#fff;
    box-shadow: 0 8px 18px rgba(5,12,32,0.45), inset 0 1px 0 rgba(255,255,255,0.28); }
  .chip.c1 { background:linear-gradient(135deg,#3b82f6,#2563eb); }
  .chip.c2 { background:linear-gradient(135deg,#6366f1,#4f46e5); }
  .chip.c3 { background:linear-gradient(135deg,#0ea5e9,#2f74e0); }
  .chip.c4 { background:linear-gradient(135deg,#22c5e6,#3b82f6); }
  .chip .ico { width:21px; height:21px; border-radius:7px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow1"></div>
  <div class="glow2"></div>

  <div class="wrap">
    <!-- ICON -->
    <div class="icon">
      <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sq" x1="20" y1="22" x2="100" y2="100" gradientUnits="userSpaceOnUse">
            <stop stop-color="#bfe0ff"/><stop offset="1" stop-color="#5aa3ff"/>
          </linearGradient>
          <linearGradient id="m1" x1="30" y1="50" x2="62" y2="92" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2f6fe0"/><stop offset="1" stop-color="#1e57c8"/>
          </linearGradient>
          <linearGradient id="m2" x1="58" y1="58" x2="96" y2="92" gradientUnits="userSpaceOnUse">
            <stop stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/>
          </linearGradient>
        </defs>
        <g stroke="#4f9bff" stroke-width="6.5" stroke-linecap="round" fill="none">
          <path d="M14 34 V20 a6 6 0 0 1 6-6 H34"/>
          <path d="M86 14 H100 a6 6 0 0 1 6 6 V34"/>
          <path d="M106 86 V100 a6 6 0 0 1 -6 6 H86"/>
          <path d="M34 106 H20 a6 6 0 0 1 -6 -6 V86"/>
        </g>
        <rect x="28" y="28" width="64" height="64" rx="14" fill="url(#sq)"/>
        <circle cx="74" cy="46" r="8" fill="#eaf4ff"/>
        <path d="M30 90 L52 56 L70 90 Z" fill="url(#m1)"/>
        <path d="M58 90 L80 60 L92 78 V90 Z" fill="url(#m2)"/>
      </svg>
    </div>

    <!-- CONTENT -->
    <div class="content">
      <div class="eyebrow">
        <span class="dot"></span><span class="brand">ImageCraft</span>
        <span class="sep"></span><span class="by">by Softminal</span>
      </div>

      <div class="headline">Your All-in-One<br><span class="accent">Image Toolkit</span></div>
      <div class="sub">AI alt text &amp; titles, SEO file renaming, and smart compression — one plugin.</div>

      <div class="chips">
        <div class="chip c1"><span class="ico">
          <svg width="13" height="13" viewBox="0 0 24 24"><path d="M12 2.5l1.9 4.4 4.6.5-3.4 3 .9 4.5L12 16.7 8 14.9l.9-4.5-3.4-3 4.6-.5L12 2.5z" fill="#fff"/></svg>
        </span>AI Alt Text</div>
        <div class="chip c2"><span class="ico">
          <svg width="13" height="13" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
        </span>AI Titles</div>
        <div class="chip c3"><span class="ico">
          <svg width="13" height="13" viewBox="0 0 24 24"><path d="M14 6l4 4-8 8H6v-4l8-8z" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" fill="none"/></svg>
        </span>SEO Rename</div>
        <div class="chip c4"><span class="ico">
          <svg width="13" height="13" viewBox="0 0 24 24"><path d="M12 3v7M12 3L9 6M12 3l3 3" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><rect x="5" y="13" width="14" height="6" rx="2" fill="#fff"/></svg>
        </span>Smart Compress</div>
      </div>
    </div>
  </div>
</body>
</html>
