<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="6" fill="url(#accent)"/>

  <!-- Brand row -->
  <g transform="translate(80, 70)">
    <rect width="44" height="44" rx="10" fill="url(#accent)"/>
    <text x="22" y="30" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">S</text>
    <text x="64" y="30" font-size="20" font-weight="600" fill="#CBD5E1">Spectra</text>
    <text x="172" y="30" font-size="20" font-weight="400" fill="#64748B">&#215;</text>
    <text x="198" y="30" font-size="20" font-weight="600" fill="#CBD5E1">ImageCraft</text>
  </g>

  <!-- Headline -->
  <text x="80" y="190" font-size="58" font-weight="800" fill="#FFFFFF">AI Alt Text &amp; SEO File Names</text>
  <text x="80" y="252" font-size="58" font-weight="800" fill="url(#accent)">for Spectra Image Blocks</text>

  <!-- BEFORE card -->
  <g transform="translate(80, 320)" filter="url(#shadow)">
    <rect width="480" height="230" rx="18" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="28" y="44" font-size="15" font-weight="700" letter-spacing="2" fill="#F87171">BEFORE</text>
    <!-- image placeholder -->
    <rect x="28" y="64" width="120" height="120" rx="10" fill="#334155"/>
    <path d="M58 152 l24 -30 l18 22 l16 -20 l24 28 z" fill="#475569"/>
    <circle cx="70" cy="98" r="12" fill="#475569"/>
    <!-- lines -->
    <text x="170" y="92" font-size="17" fill="#94A3B8">alt=<tspan fill="#F87171">""</tspan></text>
    <rect x="170" y="106" width="270" height="1.5" fill="#334155"/>
    <text x="170" y="146" font-size="17" font-family="ui-monospace, Menlo, monospace" fill="#94A3B8">IMG_4521.jpg</text>
    <circle cx="452" cy="40" r="16" fill="#7F1D1D"/>
    <path d="M446 34 l12 12 M458 34 l-12 12" stroke="#FCA5A5" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- AFTER card -->
  <g transform="translate(640, 320)" filter="url(#shadow)">
    <rect width="480" height="230" rx="18" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
    <text x="28" y="44" font-size="15" font-weight="700" letter-spacing="2" fill="#34D399">AFTER</text>
    <rect x="28" y="64" width="120" height="120" rx="10" fill="#334155"/>
    <path d="M58 152 l24 -30 l18 22 l16 -20 l24 28 z" fill="#6366F1"/>
    <circle cx="70" cy="98" r="12" fill="#8B5CF6"/>
    <text x="170" y="92" font-size="17" fill="#E2E8F0">alt=<tspan fill="#34D399">"red leather handbag"</tspan></text>
    <rect x="170" y="106" width="270" height="1.5" fill="#334155"/>
    <text x="170" y="146" font-size="17" font-family="ui-monospace, Menlo, monospace" fill="#E2E8F0">red-leather-handbag.jpg</text>
    <circle cx="452" cy="40" r="16" fill="#064E3B"/>
    <path d="M444 40 l6 6 l12 -13" stroke="#6EE7B7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
